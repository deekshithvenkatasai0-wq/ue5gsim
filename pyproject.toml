[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ue5gsim"
version = "0.1.0"
description = "Open-source 5G UE simulator: 5G-AKA, NAS security, registration, PDU sessions and mobility"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["cryptography>=41"]
keywords = ["5g", "ue", "simulator", "nas", "3gpp", "milenage", "telecom"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]
